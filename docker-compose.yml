services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: club-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-club_operations}
      POSTGRES_USER: ${DB_USER:-clubops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-club-ops-dev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clubops} -d ${DB_NAME:-club_operations}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - club-ops-network

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: club-ops-api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-club_operations}
      DB_USER: ${DB_USER:-clubops}
      DB_PASSWORD: ${DB_PASSWORD:-club-ops-dev}
      DB_SSL: ${DB_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      KIOSK_TOKEN: ${KIOSK_TOKEN}
      GYM_LOCKER_ELIGIBLE_RANGES: ${GYM_LOCKER_ELIGIBLE_RANGES:-1000-1999,5000-5999}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-development}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-development}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - club-ops-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Customer Kiosk Frontend
  customer-kiosk:
    build:
      context: .
      dockerfile: Dockerfile.customer-kiosk
      args:
        VITE_API_BASE_URL: /api
        VITE_KIOSK_TOKEN: ${KIOSK_TOKEN}
    container_name: club-ops-customer-kiosk
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - club-ops-network

  # Employee Register Frontend
  employee-register:
    build:
      context: .
      dockerfile: Dockerfile.employee-register
      args:
        VITE_API_BASE_URL: /api
        VITE_KIOSK_TOKEN: ${KIOSK_TOKEN}
    container_name: club-ops-employee-register
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - club-ops-network

  # Office Dashboard Frontend
  office-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.office-dashboard
      args:
        VITE_API_BASE_URL: /api
        VITE_KIOSK_TOKEN: ${KIOSK_TOKEN}
    container_name: club-ops-office-dashboard
    restart: unless-stopped
    ports:
      - "5176:80"
    depends_on:
      - api
    networks:
      - club-ops-network

volumes:
  postgres_data:
    name: club-ops-postgres-data

networks:
  club-ops-network:
    name: club-ops-network
    driver: bridge
