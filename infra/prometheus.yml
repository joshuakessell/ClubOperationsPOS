global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'club-ops'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'docker'
    static_configs:
      - targets: ['docker:9323']

  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules.yml'
