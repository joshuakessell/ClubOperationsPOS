# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    # ESLint is disabled in Trunk because its sandbox copies files to /tmp,
    # breaking import.meta.dirname-based tsconfigRootDir resolution in our
    # flat ESLint config. ESLint runs correctly via `pnpm lint` in CI.
    - eslint
  enabled:
    - actionlint@1.7.11
    - cfnlint@1.44.0
    - checkov@3.2.501
    - git-diff-check
    - hadolint@2.14.0
    - ls-lint@2.3.1
    - markdownlint@0.47.0
    - osv-scanner@2.3.3
    - oxipng@10.1.0
    - prettier@3.8.1
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - svgo@4.0.0
    - trufflehog@3.93.3
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
