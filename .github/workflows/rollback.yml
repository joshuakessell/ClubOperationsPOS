name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - demo
          - production
      git_ref:
        description: 'Git tag or commit SHA to rollback to'
        required: true
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

concurrency:
  group: rollback-${{ inputs.environment }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate-rollback:
    name: Validate rollback target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate git reference
        run: |
          if ! git rev-parse "${{ inputs.git_ref }}" >/dev/null 2>&1; then
            echo "ERROR: Invalid git reference: ${{ inputs.git_ref }}"
            exit 1
          fi
          echo "✓ Git reference is valid"
          
          commit_sha=$(git rev-parse "${{ inputs.git_ref }}")
          echo "COMMIT_SHA=${commit_sha}" >> $GITHUB_ENV
          echo "Rolling back to commit: ${commit_sha}"

      - name: Create rollback audit log
        run: |
          echo "## Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ inputs.git_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${COMMIT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "**Initiated by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  rollback-api:
    name: Rollback API
    needs: validate-rollback
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Determine AWS credentials
        id: aws-config
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "role_arn=${{ secrets.AWS_ROLE_ARN_PROD }}" >> $GITHUB_OUTPUT
            echo "service_arn=${{ secrets.APP_RUNNER_SERVICE_ARN_PROD }}" >> $GITHUB_OUTPUT
            echo "ecr_uri=${{ secrets.ECR_REPO_URI_PROD }}" >> $GITHUB_OUTPUT
            echo "db_secret=${{ secrets.DATABASE_URL_SECRET_ARN_PROD }}" >> $GITHUB_OUTPUT
            echo "kiosk_secret=${{ secrets.KIOSK_TOKEN_SECRET_ARN_PROD }}" >> $GITHUB_OUTPUT
            echo "appsync_endpoint=${{ secrets.APPSYNC_EVENTS_HTTP_ENDPOINT_PROD }}" >> $GITHUB_OUTPUT
            echo "appsync_namespace=${{ secrets.APPSYNC_EVENTS_CHANNEL_NAMESPACE_PROD }}" >> $GITHUB_OUTPUT
            echo "demo_mode=false" >> $GITHUB_OUTPUT
          else
            echo "role_arn=${{ secrets.AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
            echo "service_arn=${{ secrets.APP_RUNNER_SERVICE_ARN }}" >> $GITHUB_OUTPUT
            echo "ecr_uri=${{ secrets.ECR_REPO_URI }}" >> $GITHUB_OUTPUT
            echo "db_secret=${{ secrets.DATABASE_URL_SECRET_ARN }}" >> $GITHUB_OUTPUT
            echo "kiosk_secret=${{ secrets.KIOSK_TOKEN_SECRET_ARN }}" >> $GITHUB_OUTPUT
            echo "appsync_endpoint=${{ secrets.APPSYNC_EVENTS_HTTP_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "appsync_namespace=club-ops" >> $GITHUB_OUTPUT
            echo "demo_mode=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-config.outputs.role_arn }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rollback API deployment
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          APP_RUNNER_SERVICE_ARN: ${{ steps.aws-config.outputs.service_arn }}
          ECR_REPO_URI: ${{ steps.aws-config.outputs.ecr_uri }}
          DATABASE_URL_SECRET_ARN: ${{ steps.aws-config.outputs.db_secret }}
          KIOSK_TOKEN_SECRET_ARN: ${{ steps.aws-config.outputs.kiosk_secret }}
          APPSYNC_EVENTS_HTTP_ENDPOINT: ${{ steps.aws-config.outputs.appsync_endpoint }}
          APPSYNC_EVENTS_CHANNEL_NAMESPACE: ${{ steps.aws-config.outputs.appsync_namespace }}
          LOG_LEVEL: info
          DEMO_MODE: ${{ steps.aws-config.outputs.demo_mode }}
          DEMO_RESET_ON_STARTUP: 'false'
          DEMO_SHIFT_REGENERATE_PDFS: 'false'
          SKIP_DB_MIGRATIONS: 'true'
          SKIP_DEMO_SEED: 'true'
          SKIP_DB_VERIFY: 'false'
          SEED_ON_STARTUP: 'false'
          DEMO_INCREMENTAL: 'false'
          DEMO_FORCE_RESEED: 'false'
          DB_SSL: 'true'
          DB_SSL_CA_PATH: ''
          DB_LOG_QUERIES: 'false'
          SKIP_PNPM_INSTALL: 'true'
        run: scripts/aws/deploy-api.sh

  rollback-frontends:
    name: Rollback Frontend Apps
    needs: rollback-api
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - name: employee-register
            script: deploy-employee-register.sh
          - name: customer-kiosk
            script: deploy-customer-kiosk.sh

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Determine environment config
        id: env-config
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "role_arn=${{ secrets.AWS_ROLE_ARN_PROD }}" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.API_BASE_URL_PROD }}" >> $GITHUB_OUTPUT
            echo "kiosk_secret=${{ secrets.KIOSK_TOKEN_SECRET_ARN_PROD }}" >> $GITHUB_OUTPUT
            echo "appsync_namespace=${{ secrets.APPSYNC_EVENTS_CHANNEL_NAMESPACE_PROD }}" >> $GITHUB_OUTPUT
            echo "employee_bucket=${{ secrets.EMPLOYEE_BUCKET_PROD }}" >> $GITHUB_OUTPUT
            echo "employee_dist=${{ secrets.EMPLOYEE_DISTRIBUTION_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "customer_bucket=${{ secrets.CUSTOMER_BUCKET_PROD }}" >> $GITHUB_OUTPUT
            echo "customer_dist=${{ secrets.CUSTOMER_DISTRIBUTION_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "role_arn=${{ secrets.AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
            echo "api_url=https://api-demo.joshuakessell.com" >> $GITHUB_OUTPUT
            echo "kiosk_secret=${{ secrets.KIOSK_TOKEN_SECRET_ARN }}" >> $GITHUB_OUTPUT
            echo "appsync_namespace=club-ops" >> $GITHUB_OUTPUT
            echo "employee_bucket=${{ vars.EMPLOYEE_BUCKET }}" >> $GITHUB_OUTPUT
            echo "employee_dist=${{ vars.EMPLOYEE_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
            echo "customer_bucket=${{ vars.CUSTOMER_BUCKET }}" >> $GITHUB_OUTPUT
            echo "customer_dist=${{ vars.CUSTOMER_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env-config.outputs.role_arn }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rollback ${{ matrix.app.name }}
        env:
          VITE_API_BASE_URL: ${{ steps.env-config.outputs.api_url }}
          VITE_REALTIME_PROVIDER: appsync-events
          VITE_REALTIME_CHANNEL_NAMESPACE: ${{ steps.env-config.outputs.appsync_namespace }}
          VITE_DISABLE_WS: 'false'
          SKIP_PNPM_INSTALL: 'true'
          KIOSK_TOKEN_SECRET_ARN: ${{ steps.env-config.outputs.kiosk_secret }}
          EMPLOYEE_BUCKET: ${{ steps.env-config.outputs.employee_bucket }}
          EMPLOYEE_DISTRIBUTION_ID: ${{ steps.env-config.outputs.employee_dist }}
          CUSTOMER_BUCKET: ${{ steps.env-config.outputs.customer_bucket }}
          CUSTOMER_DISTRIBUTION_ID: ${{ steps.env-config.outputs.customer_dist }}
        run: scripts/aws/${{ matrix.app.script }}

  verify-rollback:
    name: Verify rollback
    needs: rollback-frontends
    runs-on: ubuntu-latest

    steps:
      - name: Determine endpoints
        id: endpoints
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "api_url=${{ secrets.API_BASE_URL_PROD }}" >> $GITHUB_OUTPUT
            echo "employee_url=${{ secrets.EMPLOYEE_URL_PROD }}" >> $GITHUB_OUTPUT
            echo "customer_url=${{ secrets.CUSTOMER_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=https://api-demo.joshuakessell.com" >> $GITHUB_OUTPUT
            echo "employee_url=https://employee-demo.joshuakessell.com" >> $GITHUB_OUTPUT
            echo "customer_url=https://customer-demo.joshuakessell.com" >> $GITHUB_OUTPUT
          fi

      - name: Test API health
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" ${{ steps.endpoints.outputs.api_url }}/health)
          if [ "$response" != "200" ]; then
            echo "ERROR: API health check failed with status $response"
            exit 1
          fi
          echo "✓ API health check passed"

      - name: Test employee-register
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" -I ${{ steps.endpoints.outputs.employee_url }})
          if [ "$response" != "200" ]; then
            echo "ERROR: Employee register check failed with status $response"
            exit 1
          fi
          echo "✓ Employee register accessible"

      - name: Test customer-kiosk
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" -I ${{ steps.endpoints.outputs.customer_url }})
          if [ "$response" != "200" ]; then
            echo "ERROR: Customer kiosk check failed with status $response"
            exit 1
          fi
          echo "✓ Customer kiosk accessible"

      - name: Rollback summary
        run: |
          echo "## Rollback Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Rolled back to:** ${{ inputs.git_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All services verified healthy." >> $GITHUB_STEP_SUMMARY
