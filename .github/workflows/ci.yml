name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://test:testpassword@localhost:5432/testdb

      - name: Seed demo DB (for integration tests)
        run: pnpm -C services/api seed:demo
        env:
          # Seed scripts use DB_* env vars (not DATABASE_URL)
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: testdb
          DB_USER: test
          DB_PASSWORD: testpassword
          # Demo seed requires this flag
          DEMO_MODE: "true"
          # Use deterministic, fast seed for CI
          DEMO_RESET_ON_STARTUP: "true"
          DEMO_INCREMENTAL: "true"
          KIOSK_TOKEN: "dummy-token-for-tests"

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://test:testpassword@localhost:5432/testdb
          KIOSK_TOKEN: "dummy-token-for-tests"
          # Some integration tests create their own pg.Pool using DB_* env vars
          # (instead of DATABASE_URL). Keep these aligned with the CI Postgres
          # service above so tests don't fall back to incorrect defaults.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: testdb
          DB_USER: test
          DB_PASSWORD: testpassword
