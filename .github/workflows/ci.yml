name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      # NOTE: We intentionally do NOT cache the pnpm store in CI.
      # Saving the pnpm store cache is frequently slower than re-installing and
      # can hang indefinitely in post-job cache upload ("Post Cache pnpm store").
      # If we want caching later, prefer caching smaller artifacts (e.g. Turbo).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://test:testpassword@localhost:5432/testdb

      - name: Seed demo DB (for integration tests)
        run: pnpm -C services/api seed:demo
        env:
          # Seed scripts use DB_* env vars (not DATABASE_URL)
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: testdb
          DB_USER: test
          DB_PASSWORD: testpassword
          # Demo seed requires this flag
          DEMO_MODE: "true"
          # Use deterministic, fast seed for CI
          DEMO_RESET_ON_STARTUP: "true"
          DEMO_INCREMENTAL: "true"
          KIOSK_TOKEN: "dummy-token-for-tests"

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://test:testpassword@localhost:5432/testdb
          KIOSK_TOKEN: "dummy-token-for-tests"
          # Some integration tests create their own pg.Pool using DB_* env vars
          # (instead of DATABASE_URL). Keep these aligned with the CI Postgres
          # service above so tests don't fall back to incorrect defaults.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: testdb
          DB_USER: test
          DB_PASSWORD: testpassword

      - name: Debug lingering processes
        if: always()
        run: |
          echo "=== ps aux (top 40) ==="
          ps aux --sort=-%cpu | head -n 40
          echo "=== node processes ==="
          ps aux | grep -E "node|vitest|vite" | grep -v grep || true

      - name: Debug pnpm store size
        if: always()
        run: |
          echo "pnpm store path: $(pnpm store path)"
          du -sh "$(pnpm store path)" || true
