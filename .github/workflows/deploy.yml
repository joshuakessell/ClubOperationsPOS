name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev (API + frontends)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install session-manager-plugin
        run: |
          curl -sSL -o /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          echo "/usr/local/sessionmanagerplugin/bin" >> $GITHUB_PATH

      - name: Seed demo DB via SSM tunnel
        env:
          DEMO_INCREMENTAL: 'true'
          DEMO_RESET_ON_STARTUP: 'true'
          DATABASE_URL_SECRET_ARN: ${{ secrets.DATABASE_URL_SECRET_ARN }}
          LOG_PATH: /tmp/ssm-tunnel.log
          TUNNEL_READY_TIMEOUT_SECONDS: '60'
          KILL_PORT_LISTENER: 'true'
          SKIP_PNPM_INSTALL: 'false'
          SKIP_SHARED_BUILD: 'false'
        run: scripts/aws/seed-demo-via-ssm.sh

      - name: Deploy API (App Runner)
        env:
          AWS_REGION: us-east-1
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          ECR_REPO_URI: ${{ secrets.ECR_REPO_URI }}
          DATABASE_URL_SECRET_ARN: ${{ secrets.DATABASE_URL_SECRET_ARN }}
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN }}
          APPSYNC_EVENTS_HTTP_ENDPOINT: https://yqg4r3pkvvhzvnultnequus77y.appsync-api.us-east-1.amazonaws.com/event
          APPSYNC_EVENTS_CHANNEL_NAMESPACE: club-ops
          LOG_LEVEL: info
          DEMO_MODE: 'true'
          DEMO_RESET_ON_STARTUP: 'true'
          DEMO_SHIFT_REGENERATE_PDFS: 'true'
          SKIP_DB_MIGRATIONS: 'true'
          SKIP_DEMO_SEED: 'true'
          SKIP_DB_VERIFY: 'true'
          SEED_ON_STARTUP: 'false'
          DEMO_INCREMENTAL: 'true'
          DEMO_FORCE_RESEED: 'false'
          DB_SSL: 'true'
          DB_SSL_CA_PATH: ''
          DB_LOG_QUERIES: 'false'
          SKIP_PNPM_INSTALL: 'false'
          IMAGE_TAG: dev-${{ github.sha }}
          PUSH_DEV_LATEST_TAG: 'false'
        run: scripts/aws/deploy-api.sh

      - name: Deploy employee-register
        env:
          VITE_API_BASE_URL: https://api-demo.joshuakessell.com
          VITE_LAN_FALLBACK: '1'
          VITE_LAN_API_BASE_URL: http://192.168.50.215:3000
          # NOTE: needs a real lane id; set per-kiosk/register device or via app-specific env.
          VITE_LAN_REALTIME_WS_URL: ws://192.168.50.215:3000/v1/realtime/lan/lane/REPLACE_WITH_LANE_ID
          VITE_REALTIME_TRANSPORTS: '1'
          VITE_REALTIME_PROVIDER: appsync-events
          VITE_REALTIME_CHANNEL_NAMESPACE: club-ops
          VITE_DISABLE_WS: 'false'
          SKIP_PNPM_INSTALL: 'false'
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN }}
          EMPLOYEE_BUCKET: ${{ vars.EMPLOYEE_BUCKET }}
          EMPLOYEE_DISTRIBUTION_ID: ${{ vars.EMPLOYEE_DISTRIBUTION_ID }}
        run: scripts/aws/deploy-employee-register.sh

      - name: Deploy customer-kiosk
        env:
          VITE_API_BASE_URL: https://api-demo.joshuakessell.com
          VITE_LAN_FALLBACK: '1'
          VITE_LAN_API_BASE_URL: http://192.168.50.215:3000
          # NOTE: needs a real lane id; set per-kiosk/register device or via app-specific env.
          VITE_LAN_REALTIME_WS_URL: ws://192.168.50.215:3000/v1/realtime/lan/lane/REPLACE_WITH_LANE_ID
          VITE_REALTIME_TRANSPORTS: '1'
          VITE_REALTIME_PROVIDER: appsync-events
          VITE_REALTIME_CHANNEL_NAMESPACE: club-ops
          VITE_DISABLE_WS: 'false'
          SKIP_PNPM_INSTALL: 'false'
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN }}
          CUSTOMER_BUCKET: ${{ vars.CUSTOMER_BUCKET }}
          CUSTOMER_DISTRIBUTION_ID: ${{ vars.CUSTOMER_DISTRIBUTION_ID }}
        run: scripts/aws/deploy-customer-kiosk.sh

      - name: Deployment summary
        run: |
          echo "## Dev deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://api-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
          echo "- Employee: https://employee-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
          echo "- Customer: https://customer-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ secrets.ECR_REPO_URI }}:dev-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
