name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev (API + frontends)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install session-manager-plugin
        run: |
          curl -sSL -o /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          echo "/usr/local/sessionmanagerplugin/bin" >> $GITHUB_PATH

      - name: Seed demo DB via SSM tunnel
        env:
          DEMO_INCREMENTAL: 'true'
          DEMO_RESET_ON_STARTUP: 'true'
          DATABASE_URL_SECRET_ARN: ${{ secrets.DATABASE_URL_SECRET_ARN }}
        run: scripts/aws/seed-demo-via-ssm.sh

      - name: Deploy API (App Runner)
        env:
          AWS_REGION: us-east-1
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          ECR_REPO_URI: ${{ secrets.ECR_REPO_URI }}
          DATABASE_URL_SECRET_ARN: ${{ secrets.DATABASE_URL_SECRET_ARN }}
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN }}
          APPSYNC_EVENTS_HTTP_ENDPOINT: https://yqg4r3pkvvhzvnultnequus77y.appsync-api.us-east-1.amazonaws.com/event
          APPSYNC_EVENTS_CHANNEL_NAMESPACE: club-ops
          DEMO_MODE: 'true'
          SKIP_DB_MIGRATIONS: 'true'
          SKIP_DEMO_SEED: 'true'
          SKIP_DB_VERIFY: 'true'
          SEED_ON_STARTUP: 'false'
          DEMO_INCREMENTAL: 'true'
        run: scripts/aws/deploy-api.sh

      - name: Deploy employee-register
        env:
          VITE_API_BASE_URL: https://api-demo.joshuakessell.com
          VITE_KIOSK_TOKEN: ${{ secrets.VITE_KIOSK_TOKEN }}
          EMPLOYEE_BUCKET: ${{ vars.EMPLOYEE_BUCKET }}
          EMPLOYEE_DISTRIBUTION_ID: ${{ vars.EMPLOYEE_DISTRIBUTION_ID }}
        run: scripts/aws/deploy-employee-register.sh

      - name: Deploy customer-kiosk
        env:
          VITE_API_BASE_URL: https://api-demo.joshuakessell.com
          VITE_KIOSK_TOKEN: ${{ secrets.VITE_KIOSK_TOKEN }}
          CUSTOMER_BUCKET: ${{ vars.CUSTOMER_BUCKET }}
          CUSTOMER_DISTRIBUTION_ID: ${{ vars.CUSTOMER_DISTRIBUTION_ID }}
        run: scripts/aws/deploy-customer-kiosk.sh

      - name: Deployment summary
        run: |
          echo "### Dev deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://api-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
          echo "- Employee: https://employee-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
          echo "- Customer: https://customer-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
