name: Multi-arch Docker Build

on:
  workflow_dispatch:
    inputs:
      push_to_ecr:
        description: 'Push images to ECR'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service.name }} (multi-arch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api, dockerfile: Dockerfile.api }
          - { name: customer-kiosk, dockerfile: Dockerfile.customer-kiosk }
          - { name: employee-register, dockerfile: Dockerfile.employee-register }
          - { name: office-dashboard, dockerfile: Dockerfile.office-dashboard }

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (if pushing to ECR)
        if: inputs.push_to_ecr
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: inputs.push_to_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push_to_ecr }}
          tags: |
            ${{ secrets.ECR_REPO_URI }}:${{ matrix.service.name }}-multi-arch-latest
            ${{ secrets.ECR_REPO_URI }}:${{ matrix.service.name }}-multi-arch-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-multi
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-multi
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_KIOSK_TOKEN=multi-arch-build

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
