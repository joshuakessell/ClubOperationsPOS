name: Deploy Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deployment validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm spec:check

      - name: Build all packages
        run: pnpm turbo run build
        env:
          VITE_KIOSK_TOKEN: production-placeholder
          VITE_API_BASE_URL: https://api.example.com

  deploy-api:
    name: Deploy API to AWS
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy API
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN_PROD }}
          ECR_REPO_URI: ${{ secrets.ECR_REPO_URI_PROD }}
          DATABASE_URL_SECRET_ARN: ${{ secrets.DATABASE_URL_SECRET_ARN_PROD }}
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN_PROD }}
          APPSYNC_EVENTS_HTTP_ENDPOINT: ${{ secrets.APPSYNC_EVENTS_HTTP_ENDPOINT_PROD }}
          APPSYNC_EVENTS_CHANNEL_NAMESPACE: ${{ secrets.APPSYNC_EVENTS_CHANNEL_NAMESPACE_PROD }}
          LOG_LEVEL: info
          DEMO_MODE: 'false'
          DEMO_RESET_ON_STARTUP: 'false'
          DEMO_SHIFT_REGENERATE_PDFS: 'false'
          SKIP_DB_MIGRATIONS: 'false'
          SKIP_DEMO_SEED: 'true'
          SKIP_DB_VERIFY: 'false'
          SEED_ON_STARTUP: 'false'
          DEMO_INCREMENTAL: 'false'
          DEMO_FORCE_RESEED: 'false'
          DB_SSL: 'true'
          DB_SSL_CA_PATH: ''
          DB_LOG_QUERIES: 'false'
          SKIP_PNPM_INSTALL: 'true'
        run: scripts/aws/deploy-api.sh

  deploy-frontends:
    name: Deploy Frontend Apps
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - name: employee-register
            script: deploy-employee-register.sh
            bucket_var: EMPLOYEE_BUCKET_PROD
            distribution_var: EMPLOYEE_DISTRIBUTION_ID_PROD
          - name: customer-kiosk
            script: deploy-customer-kiosk.sh
            bucket_var: CUSTOMER_BUCKET_PROD
            distribution_var: CUSTOMER_DISTRIBUTION_ID_PROD

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.app.name }}
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL_PROD }}
          VITE_REALTIME_PROVIDER: appsync-events
          VITE_REALTIME_CHANNEL_NAMESPACE: ${{ secrets.APPSYNC_EVENTS_CHANNEL_NAMESPACE_PROD }}
          VITE_DISABLE_WS: 'false'
          SKIP_PNPM_INSTALL: 'true'
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN_PROD }}
          EMPLOYEE_BUCKET: ${{ secrets[matrix.app.bucket_var] }}
          EMPLOYEE_DISTRIBUTION_ID: ${{ secrets[matrix.app.distribution_var] }}
          CUSTOMER_BUCKET: ${{ secrets[matrix.app.bucket_var] }}
          CUSTOMER_DISTRIBUTION_ID: ${{ secrets[matrix.app.distribution_var] }}
        run: scripts/aws/${{ matrix.app.script }}

  smoke-test:
    name: Post-deployment smoke tests
    needs: deploy-frontends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Test API health endpoint
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" ${{ secrets.API_BASE_URL_PROD }}/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "✓ API health check passed"

      - name: Test employee-register accessibility
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" -I ${{ secrets.EMPLOYEE_URL_PROD }})
          if [ "$response" != "200" ]; then
            echo "Employee register check failed with status $response"
            exit 1
          fi
          echo "✓ Employee register accessible"

      - name: Test customer-kiosk accessibility
        run: |
          response=$(curl -f -s -o /dev/null -w "%{http_code}" -I ${{ secrets.CUSTOMER_URL_PROD }})
          if [ "$response" != "200" ]; then
            echo "Customer kiosk check failed with status $response"
            exit 1
          fi
          echo "✓ Customer kiosk accessible"

  notify:
    name: Deployment notification
    needs: smoke-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "### Production Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ secrets.API_BASE_URL_PROD }}" >> $GITHUB_STEP_SUMMARY
          echo "- Employee Register: ${{ secrets.EMPLOYEE_URL_PROD }}" >> $GITHUB_STEP_SUMMARY
          echo "- Customer Kiosk: ${{ secrets.CUSTOMER_URL_PROD }}" >> $GITHUB_STEP_SUMMARY
