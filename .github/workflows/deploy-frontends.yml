name: Deploy (dev frontends only)

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev-frontends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev (frontends only)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy employee-register
        env:
          VITE_API_BASE_URL: https://api-demo.joshuakessell.com
          VITE_REALTIME_PROVIDER: appsync-events
          VITE_REALTIME_CHANNEL_NAMESPACE: club-ops
          VITE_DISABLE_WS: 'false'
          SKIP_PNPM_INSTALL: 'false'
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN }}
          EMPLOYEE_BUCKET: ${{ vars.EMPLOYEE_BUCKET }}
          EMPLOYEE_DISTRIBUTION_ID: ${{ vars.EMPLOYEE_DISTRIBUTION_ID }}
        run: scripts/aws/deploy-employee-register.sh

      - name: Deploy customer-kiosk
        env:
          VITE_API_BASE_URL: https://api-demo.joshuakessell.com
          VITE_REALTIME_PROVIDER: appsync-events
          VITE_REALTIME_CHANNEL_NAMESPACE: club-ops
          VITE_DISABLE_WS: 'false'
          SKIP_PNPM_INSTALL: 'false'
          KIOSK_TOKEN_SECRET_ARN: ${{ secrets.KIOSK_TOKEN_SECRET_ARN }}
          CUSTOMER_BUCKET: ${{ vars.CUSTOMER_BUCKET }}
          CUSTOMER_DISTRIBUTION_ID: ${{ vars.CUSTOMER_DISTRIBUTION_ID }}
        run: scripts/aws/deploy-customer-kiosk.sh

      - name: Deployment summary
        run: |
          echo "### Dev frontend deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- Employee: https://employee-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
          echo "- Customer: https://customer-demo.joshuakessell.com" >> $GITHUB_STEP_SUMMARY
