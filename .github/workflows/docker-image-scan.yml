name: Docker Image Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC

jobs:
  scan:
    name: Scan ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - customer-kiosk
          - employee-register
          - office-dashboard

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          load: true
          tags: club-ops-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_KIOSK_TOKEN=dummy

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: club-ops-${{ matrix.service }}:scan
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: club-ops-${{ matrix.service }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: docker-${{ matrix.service }}

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: club-ops-${{ matrix.service }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Scan for secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: club-ops-${{ matrix.service }}:scan
          scan-type: 'image'
          scanners: 'secret'
          format: 'table'

  summary:
    name: Security scan summary
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "All Docker images have been scanned for:" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerabilities (CVEs)" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets exposure" >> $GITHUB_STEP_SUMMARY
          echo "- Software Bill of Materials (SBOM)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
