version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: club-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-club_operations}
      POSTGRES_USER: ${DB_USER:-clubops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-club-ops-dev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clubops} -d ${DB_NAME:-club_operations}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - club-ops-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: club-ops-api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-club_operations}
      DB_USER: ${DB_USER:-clubops}
      DB_PASSWORD: ${DB_PASSWORD:-club-ops-dev}
      DB_SSL: ${DB_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      KIOSK_TOKEN: ${KIOSK_TOKEN}
      GYM_LOCKER_ELIGIBLE_RANGES: ${GYM_LOCKER_ELIGIBLE_RANGES:-1000-1999,5000-5999}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-development}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-development}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - club-ops-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  customer-kiosk:
    build:
      context: .
      dockerfile: Dockerfile.customer-kiosk
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_KIOSK_TOKEN: ${KIOSK_TOKEN}
    container_name: club-ops-customer-kiosk
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - club-ops-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  employee-register:
    build:
      context: .
      dockerfile: Dockerfile.employee-register
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_KIOSK_TOKEN: ${KIOSK_TOKEN}
    container_name: club-ops-employee-register
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - club-ops-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  office-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.office-dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_KIOSK_TOKEN: ${KIOSK_TOKEN}
    container_name: club-ops-office-dashboard
    restart: unless-stopped
    ports:
      - "5176:80"
    depends_on:
      - api
    networks:
      - club-ops-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    container_name: club-ops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - club-ops-network
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: club-ops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - club-ops-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
    name: club-ops-postgres-data
    driver: local
  prometheus_data:
    name: club-ops-prometheus-data
    driver: local
  grafana_data:
    name: club-ops-grafana-data
    driver: local

networks:
  club-ops-network:
    name: club-ops-network
    driver: bridge
